server:
  host: "0.0.0.0"
  port: 8080

vllm:
  binary: "uvx"
  startup_timeout: 300s
  shutdown_timeout: 30s
  drain_timeout: 60s
  swap_wait_timeout: 60s

  # Log vLLM output to files (optional)
  # log_dir: "/var/log/vllm"
  # log_max_size_mb: 50   # default: 50
  # log_max_files: 5      # default: 5

  defaults:
    gpu_memory_utilization: 0.70
    dtype: "float16"
    max_model_len: 2048

# GPU Power Management (optional)
# Option A: Per-GPU power limits at startup
# gpu_power_limits:
#   0: 250
#   1: 250

# Option B: Single default for all GPUs (mutually exclusive with gpu_power_limits)
# default_power_limit: 250

# If true, fail startup when power limit cannot be set (default: false = warn only)
# power_limit_required: false

scheduler:
  # vLLM instances will be started on ports in this range.
  port_range_start: 8100
  port_range_end: 8199
  # Optional cap on concurrent instances.
  max_instances: 8
  # Prevent thrash: don't evict instances that just started.
  min_instance_uptime: 30s
  # Command used for GPU inventory. Keep as "nvidia-smi" on NVIDIA systems.
  nvidia_smi_binary: "nvidia-smi"

behavior:
  rewrite_model_name: true

models:
  # NOTE: In scheduler mode, do NOT set CUDA_VISIBLE_DEVICES in env; the scheduler owns it.
  small:
    path: "Qwen/Qwen2.5-0.5B-Instruct"
    gpus: [0]
    min_free_mem_mb_per_gpu: 4000
    # Per-model power limit (optional, overrides global settings for this model's GPUs)
    # power_limit: 200
    # Per-model log file override (optional)
    # log_file: "/var/log/vllm/custom-model.log"

  big:
    path: "/models/Meta-Llama-3-70B-Instruct"
    gpus: [0,1,2,3]
    min_free_mem_mb_per_gpu: 40000
    # Per-model power limit (optional, overrides global settings for this model's GPUs)
    # power_limit: 350

  pinned-hot:
    path: "/models/Some-Always-On-Model"
    gpus: [4]
    min_free_mem_mb_per_gpu: 16000
    pinned: true
    # Per-model power limit (optional, overrides global settings for this model's GPUs)
    # power_limit: 300

