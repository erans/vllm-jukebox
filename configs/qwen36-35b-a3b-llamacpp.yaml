server:
  host: "0.0.0.0"
  port: 8080

vllm:
  port: 8000
  startup_timeout: 1800s
  shutdown_timeout: 30s
  drain_timeout: 60s
  swap_cooldown: 30s
  swap_wait_timeout: 60s
  log_dir: "/tmp/vllm-logs"
  log_max_size_mb: 100
  log_max_files: 3

llama_cpp:
  binary: "/home/eran/llama.cpp/build/bin/llama-server"

behavior:
  rewrite_model_name: true

models:
  qwen36-35b-a3b:
    runtime: llama_cpp
    # Hugging Face repo coordinate; llama-server downloads on first start.
    # Pick a quant tag that fits your VRAM budget. Unsloth ships "UD-" dynamic
    # quants; the "-MTP-GGUF" repo variant preserves the NextN/MTP layers so
    # --spec-type draft-mtp below can actually use them. The non-MTP repo
    # strips those layers to save space and fails at load time when MTP is
    # requested.
    path: "unsloth/Qwen3.6-35B-A3B-MTP-GGUF:UD-Q4_K_M"
    max_model_len: 65536
    extra_args:
      - "--jinja"
      - "--flash-attn"
      - "on"
      - "--n-gpu-layers"
      - "all"
      - "--split-mode"
      - "layer"
      - "--cache-type-k"
      - "q8_0"
      - "--cache-type-v"
      - "q8_0"
      - "--parallel"
      - "4"
      - "--batch-size"
      - "2048"
      - "--ubatch-size"
      - "512"
      # Multi-Token Prediction (MTP). Qwen 3.5/3.6 ship NextN/MTP layers in
      # the "-MTP-GGUF" repo variants (not the plain "-GGUF" repos, which
      # strip them). --spec-type draft-mtp turns on speculative decoding
      # against those layers — no separate draft model needed. Tuning of
      # --spec-draft-n-max / --spec-draft-p-* is left at llama-server
      # defaults; A/B against this same GGUF without --spec-type is in the
      # commit that introduced this flag.
      - "--spec-type"
      - "draft-mtp"
