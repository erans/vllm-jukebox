server:
  # Default bind is 127.0.0.1 (localhost only). This example explicitly sets
  # 0.0.0.0 to expose jukebox on all interfaces; ensure network-level
  # protection or set api_key below.
  host: "0.0.0.0"
  port: 8080
  # Optional: require `Authorization: Bearer <key>` on inference,
  # /v1/models, /status, and /metrics. /health remains open.
  # Omit to disable auth (backward compatible).
  # api_key: "change-me"

vllm:
  # Use uvx to run vLLM (assumes uvx is already installed).
  binary: "uvx"
  port: 8000
  startup_timeout: 300s
  shutdown_timeout: 30s
  drain_timeout: 60s
  swap_cooldown: 30s
  swap_wait_timeout: 60s

  # Log vLLM output to files (optional)
  # log_dir: "/var/log/vllm"
  # log_max_size_mb: 50   # default: 50
  # log_max_files: 5      # default: 5

  defaults:
    gpu_memory_utilization: 0.9
    dtype: "auto"
    max_model_len: null

# GPU Power Management (optional)
# Option A: Per-GPU power limits at startup
# gpu_power_limits:
#   0: 250
#   1: 250

# Option B: Single default for all GPUs (mutually exclusive with gpu_power_limits)
# default_power_limit: 250

# If true, fail startup when power limit cannot be set (default: false = warn only)
# power_limit_required: false

behavior:
  rewrite_model_name: true

models:
  llama-3-8b:
    path: "/models/Meta-Llama-3-8B-Instruct"
    tensor_parallel_size: 1
    # Per-model log file override (optional)
    # log_file: "/var/log/vllm/custom-model.log"

  # Example alias
  gpt-3.5-turbo:
    alias: llama-3-8b

